<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffitee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="order-btn" onclick="placeOrder()">Order Now</button>

  <h1>Coffitee</h1>
  <h3>START YOUR DAY RIGHT <br> WITH OUR FRESH COFFEE</h3>

  <div class="main-content">
    <table class="menu">
      <tr>
        <th>ITEMS</th>
        <th>PRICE</th>
      </tr>
      <tr>
        <td>Espresso</td>
        <td>$12.99</td>
      </tr>
      <tr>
        <td>Cappuccino</td>
        <td>$13.99</td>
      </tr>
      <tr>
        <td>Americano</td>
        <td>$14.99</td>
      </tr>
      <tr>
        <td>Latte</td>
        <td>$19.99</td>
      </tr>
      <tr>
        <td>Mocha</td>
        <td>$16.99</td>
      </tr>
    </table>

    <img class="coffee-pic" src="images.jpg" alt="Fresh coffee">
  </div>

  <script>
    function placeOrder() {
      console.log("Order Now button was clicked at Coffitee.");
      window.alert("Thank you for ordering from Coffitee! Your fresh coffee is being prepared.");
    }
  </script>

</body>
</html>
